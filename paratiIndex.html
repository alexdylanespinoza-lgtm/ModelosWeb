<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,300;1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --noche:#0d0a2a; --noche2:#2b1140; --rosa:#ff7eb3; --oro:#ffd98a; --bruma:#c9bff0; --texto:#f6f0ff;
  --serif:"Fraunces",Georgia,"Times New Roman",serif; --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(120% 90% at 50% 100%,var(--noche2),var(--noche) 70%) fixed var(--noche);
  color:var(--texto); font-family:var(--sans); overflow-x:hidden; -webkit-tap-highlight-color:transparent;
}
#fondo{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 150px;text-align:center}
h1{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(2rem,7vw,3.4rem);margin:8px 0 6px;letter-spacing:.01em}
.pista{margin:0;color:var(--bruma);font-size:1rem;line-height:1.5;max-width:34ch}
.contador{margin:14px 0 0;font-family:var(--serif);font-style:italic;color:var(--oro);font-size:1.15rem;min-height:1.5em}
.cielo{position:relative;width:min(92vw,60vh);aspect-ratio:1;margin-top:10px}
.cielo svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:var(--oro);stroke-width:.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.1s ease}
.edge.on{stroke-dashoffset:0}
.relleno{fill:var(--rosa);opacity:0;transition:opacity 2s ease}
.relleno.on{opacity:.22;filter:blur(.6px)}
.star{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border:0;background:none;padding:0;cursor:pointer;border-radius:50%}
.star::before{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px rgba(255,255,255,.7);animation:titila 2.8s ease-in-out infinite;animation-delay:var(--d)}
.star:hover::before,.star:focus-visible::before{width:10px;height:10px;margin:-5px;box-shadow:0 0 14px 4px rgba(255,217,138,.9)}
.star:focus-visible{outline:2px solid var(--oro);outline-offset:-6px}
.star.found::before{background:var(--oro);width:11px;height:11px;margin:-5.5px;animation:none;box-shadow:0 0 16px 5px rgba(255,217,138,.85)}
@keyframes titila{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.luna{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));right:18px;z-index:3;width:54px;height:54px;border-radius:50%;border:0;padding:0;cursor:pointer;
  background:radial-gradient(circle at 35% 35%,#fffbe8,#f3dd9c 60%,#d9bd72);box-shadow:0 0 24px 4px rgba(255,236,170,.35)}
.luna::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--noche);transform:translate(var(--sombra,34%),-6%) ;opacity:.92;transition:transform .6s ease;clip-path:circle(50% at 40% 50%)}
.luna:focus-visible{outline:2px solid var(--rosa);outline-offset:4px}
.luna.vuelta{animation:giro .7s ease}
@keyframes giro{50%{transform:rotate(14deg) scale(1.12)}}
.nota{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:4;width:min(92vw,460px);transform:translate(-50%,140%);
  background:rgba(24,14,52,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,217,138,.35);border-radius:20px;padding:22px 24px 18px;text-align:left;
  transition:transform .5s cubic-bezier(.2,.9,.3,1)}
.nota.abierta{transform:translate(-50%,0)}
.nota p{margin:0;font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(1.15rem,4.4vw,1.4rem);line-height:1.5}
.nota small{display:block;margin-top:12px;color:var(--bruma);font-size:.85rem}
.nota button{all:unset;cursor:pointer;color:var(--oro);font-size:.9rem;margin-top:12px;display:inline-block;padding:4px 0}
.nota button:focus-visible{outline:2px solid var(--oro);outline-offset:3px}
.reinicio{all:unset;cursor:pointer;margin-top:22px;color:var(--bruma);font-size:.85rem;opacity:.7;padding:6px}
.reinicio:focus-visible{outline:2px solid var(--oro)}
.flota{position:fixed;z-index:5;pointer-events:none;color:var(--rosa);font-size:18px;will-change:transform,opacity}
.estela{position:fixed;z-index:2;left:0;top:0;width:90px;height:3px;border:0;padding:0;cursor:pointer;border-radius:3px;
  background:linear-gradient(90deg,transparent,#fff);box-shadow:0 0 12px 2px rgba(255,255,255,.8)}
.estela::after{content:"";position:absolute;inset:-14px}
@media (prefers-reduced-motion:reduce){.star::before{animation:none;opacity:.8}.edge,.relleno,.nota{transition:none}.luna.vuelta{animation:none}}
</style>
</head>
<body>
<canvas id="fondo" aria-hidden="true"></canvas>
<button class="luna" id="luna" aria-label="La luna"></button>
<main>
  <h1 id="titulo">Para ti</h1>
  <p class="pista">Hay ocho estrellas escondidas en este cielo. Las que brillan distinto guardan algo para ti.</p>
  <p class="contador" id="contador" aria-live="polite">0 de 8 encontradas</p>
  <div class="cielo" id="cielo">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <path id="relleno" class="relleno" d="M50 90 L22 64 L10 37 L28 16 L50 32 L72 16 L90 37 L78 64 Z"/>
      <g id="lineas"></g>
    </svg>
  </div>
  <button class="reinicio" id="reinicio" hidden>Volver a empezar</button>
</main>
<div class="nota" id="nota" role="status" aria-live="polite">
  <p id="notaTxt"></p><small id="notaPie"></small>
  <button id="cerrar">Cerrar</button>
</div>

<script>
/* ===== Personaliza aquí ===== */
const CONFIG = {
  nombre: "mi amor",
  desde: "2026-09-x",           // fecha en la que empezó su historia (AAAA-MM-DD)
  firma: "Tu persona favorita",
  notas: [
    "Tu risa es mi sonido favorito, incluso cuando no sabes que me estás haciendo feliz.",
    "Contigo hasta los lunes se sienten como domingo.",
    "Gracias por quedarte en los días difíciles. Se nota más de lo que digo.",
    "Si pudiera guardar un momento, sería cualquiera en el que me miras y sonríes sin decir nada.",
    "Eres mi lugar tranquilo y mi mejor aventura, las dos cosas a la vez.",
    "Prometo seguir eligiéndote, también cuando sea fácil olvidarlo.",
    "Hay una canción que me recuerda a ti. Pídemela cuando nos veamos y la ponemos.",
    "Última pista: busca la luna y tócala tres veces."
  ],
  final: "Las encontraste todas. Igual que me encontraste a mí: sin hacer ruido y cambiando todo el cielo."
};
/* ============================ */

const $ = id => document.getElementById(id);
const quieto = matchMedia("(prefers-reduced-motion: reduce)").matches;
const PTS = [[50,90],[22,64],[10,37],[28,16],[50,32],[72,16],[90,37],[78,64]];
const NS = "http://www.w3.org/2000/svg";
let found = new Set(), cerrarT;

$("titulo").textContent = "Para ti, " + CONFIG.nombre;

/* Estrellas ocultas y líneas */
PTS.forEach((p,i)=>{
  const b = document.createElement("button");
  b.className = "star"; b.style.left = p[0]+"%"; b.style.top = p[1]+"%"; b.style.setProperty("--d",(i*.37)+"s");
  b.setAttribute("aria-label","Una estrella que brilla distinto");
  b.addEventListener("click",e=>{ e.stopPropagation(); descubrir(i,b); });
  $("cielo").appendChild(b);
  const q = PTS[(i+1)%PTS.length], l = document.createElementNS(NS,"line");
  l.setAttribute("x1",p[0]);l.setAttribute("y1",p[1]);l.setAttribute("x2",q[0]);l.setAttribute("y2",q[1]);
  l.setAttribute("pathLength","1"); l.setAttribute("class","edge"); l.id = "e"+i;
  $("lineas").appendChild(l);
});

function descubrir(i,el){
  if(!found.has(i)){
    found.add(i); el.classList.add("found"); el.setAttribute("aria-label","Estrella encontrada");
    PTS.forEach((_,k)=>{ if(found.has(k)&&found.has((k+1)%PTS.length)) $("e"+k).classList.add("on"); });
    $("contador").textContent = found.size+" de 8 encontradas";
  }
  const r = el.getBoundingClientRect(); corazones(r.left+r.width/2, r.top+r.height/2, 7);
  if(found.size===PTS.length && !$("relleno").classList.contains("on")){
    setTimeout(final,1300); mostrar(CONFIG.notas[i],"",9000);
  } else mostrar(CONFIG.notas[i],"",0);
}

function dias(){
  const d = Math.floor((Date.now()-new Date(CONFIG.desde+"T00:00:00"))/864e5);
  return isNaN(d)||d<0 ? null : d;
}
function final(){
  $("relleno").classList.add("on");
  $("contador").textContent = "Todas encontradas ♥";
  const n = dias();
  mostrar(CONFIG.final, (n?("Llevamos "+n.toLocaleString("es")+" días juntos. "):"")+"— "+CONFIG.firma, 0);
  $("reinicio").hidden = false; lluvia();
}

/* Panel de notas */
function mostrar(txt,pie,auto){
  clearTimeout(cerrarT);
  $("notaTxt").textContent = txt; $("notaPie").textContent = pie||"";
  $("nota").classList.add("abierta");
  if(auto) cerrarT = setTimeout(cerrar,auto);
}
function cerrar(){ $("nota").classList.remove("abierta"); }
$("cerrar").addEventListener("click",cerrar);

/* Corazones */
function corazones(x,y,n){
  if(quieto) return;
  for(let i=0;i<n;i++){
    const s = document.createElement("span"); s.className="flota"; s.textContent = i%3?"♥":"✦";
    s.style.left=x+"px"; s.style.top=y+"px"; s.style.color = i%3?"var(--rosa)":"var(--oro)";
    document.body.appendChild(s);
    const a = Math.random()*Math.PI*2, d = 40+Math.random()*60;
    s.animate([{transform:"translate(0,0) scale(.6)",opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d-30}px) scale(1.2)`,opacity:0}],{duration:900+Math.random()*500,easing:"ease-out"}).onfinish=()=>s.remove();
  }
}
function lluvia(){
  if(quieto) return;
  for(let i=0;i<36;i++){
    const s = document.createElement("span"); s.className="flota"; s.textContent="♥";
    s.style.left=(Math.random()*100)+"vw"; s.style.top="-30px"; s.style.fontSize=(14+Math.random()*18)+"px";
    document.body.appendChild(s);
    s.animate([{transform:"translateY(0)",opacity:1},{transform:`translateY(${innerHeight+60}px) rotate(${Math.random()*80-40}deg)`,opacity:.2}],{duration:3200+Math.random()*2800,delay:Math.random()*1800,easing:"ease-in",fill:"backwards"}).onfinish=()=>s.remove();
  }
}

/* Luna: tócala tres veces */
let tl = 0;
const lunaMsgs = ["La luna también se acuerda de ti.","Dicen que la luna cambia, pero lo que siento no.","Si algún día no me ves, mira hacia arriba: estoy pensando en ti."];
$("luna").addEventListener("click",e=>{
  tl++; const l = $("luna"); l.classList.remove("vuelta"); void l.offsetWidth; l.classList.add("vuelta");
  l.style.setProperty("--sombra",[34,10,-6,-30,34][tl%5]+"%");
  if(tl%3===0){ mostrar(lunaMsgs[(tl/3-1)%lunaMsgs.length],"Un secreto que solo se encuentra tocando la luna.",7000); corazones(e.clientX,e.clientY,10); }
});

/* Estrella fugaz */
function fugaz(){
  if(!quieto && !document.hidden){
    const el = document.createElement("button"); el.className="estela"; el.setAttribute("aria-label","Estrella fugaz");
    const y0 = 40+Math.random()*innerHeight*.35, x0 = Math.random()*innerWidth*.5;
    el.style.transformOrigin="100% 50%"; document.body.appendChild(el);
    const a = el.animate([{transform:`translate(${x0}px,${y0}px) rotate(22deg)`,opacity:0},{opacity:1,offset:.15},{transform:`translate(${x0+innerWidth*.6}px,${y0+innerHeight*.3}px) rotate(22deg)`,opacity:0}],{duration:3800,easing:"ease-in"});
    a.onfinish=()=>el.remove();
    el.addEventListener("click",e=>{ e.stopPropagation(); a.cancel(); el.remove(); corazones(e.clientX,e.clientY,14); mostrar("Pide un deseo. Yo ya pedí el mío, y ya lo tengo contigo.","",6000); });
  }
  setTimeout(fugaz,11000+Math.random()*9000);
}
setTimeout(fugaz,6000);

/* Escribe «te amo» en cualquier momento */
let buf = "";
addEventListener("keydown",e=>{
  if(e.key.length!==1) return; buf = (buf+e.key.toLowerCase()).replace(/\s/g,"").slice(-8);
  if(buf.endsWith("teamo")){ lluvia(); mostrar("Yo más.","Lo encontraste escribiendo, ¡qué lista!",6000); buf=""; }
});

/* Tocar el cielo deja destellos */
document.addEventListener("pointerdown",e=>{
  if(e.target.closest("button,.nota")) return; corazones(e.clientX,e.clientY,3);
});

/* Reiniciar */
$("reinicio").addEventListener("click",()=>{
  found.clear(); document.querySelectorAll(".star").forEach(s=>{s.classList.remove("found");s.setAttribute("aria-label","Una estrella que brilla distinto")});
  document.querySelectorAll(".edge").forEach(l=>l.classList.remove("on")); $("relleno").classList.remove("on");
  $("contador").textContent="0 de 8 encontradas"; $("reinicio").hidden=true; cerrar();
});

/* Fondo de estrellas */
const cv = $("fondo"), cx = cv.getContext("2d"); let est=[];
function medir(){
  const r = devicePixelRatio||1; cv.width=innerWidth*r; cv.height=innerHeight*r; cx.setTransform(r,0,0,r,0,0);
  est = Array.from({length:Math.min(160,Math.floor(innerWidth*innerHeight/6000))},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.3+.3,f:Math.random()*6.28,v:.4+Math.random()*1.2}));
}
function pinta(t){
  cx.clearRect(0,0,innerWidth,innerHeight);
  for(const s of est){ cx.globalAlpha = quieto?.6:.3+.7*Math.abs(Math.sin(t/1000*s.v+s.f)); cx.fillStyle="#fff"; cx.beginPath(); cx.arc(s.x,s.y,s.r,0,6.283); cx.fill(); }
  if(!quieto) requestAnimationFrame(pinta);
}
addEventListener("resize",medir); medir(); requestAnimationFrame(pinta);
</script>
</body>
</html>
